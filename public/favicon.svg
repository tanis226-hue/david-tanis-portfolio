<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DT">
  <!-- Letterforms are outlined paths, not <text>: a favicon renders outside the page,
       so a font-family reference is not guaranteed to resolve.
       Geometry is tuned for a 16px tab render: 7-unit strokes on a 64 grid keep the
       D counter open, and a 10-unit margin stops the letters colliding with the
       rounded corners. -->
  <rect width="64" height="64" rx="10" fill="#ffffff"/>
  <g fill="#000000">
    <!-- D: 7-wide stem, bowl swept from the stem edge on a 16 radius. -->
    <path fill-rule="evenodd" d="M10 16 H17 A16 16 0 0 1 17 48 H10 Z M17 23 A9 9 0 0 1 17 41 Z"/>
    <!-- T: bar and stem share the 7-unit weight and a common centre at x=45.5. -->
    <path d="M37 16 H54 V23 H37 Z"/>
    <path d="M42 23 H49 V48 H42 Z"/>
  </g>
</svg>
